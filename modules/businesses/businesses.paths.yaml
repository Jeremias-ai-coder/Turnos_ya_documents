/businesses:
  get:
    summary: Listar negocios
    tags: [Businesses]
    parameters:
      - in: query
        name: page
        schema:
          type: integer
          default: 1
      - in: query
        name: limit
        schema:
          type: integer
          default: 10
      - in: query
        name: search
        schema:
          type: string
    responses:
      '200':
        description: Lista paginada de negocios
        content:
          application/json:
            schema:
              $ref: './businesses.schemas.yaml#/BusinessPaginatedResponse'
  post:
    summary: Crear un nuevo negocio
    tags: [Businesses]
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './businesses.schemas.yaml#/CreateBusinessRequest'
    responses:
      '201':
        description: Negocio creado exitosamente
        content:
          application/json:
            schema:
              $ref: './businesses.schemas.yaml#/Business'
      '400':
        description: Datos inválidos
        content:
          application/json:
            schema:
              $ref: '../../components/errors.yaml#/ErrorResponse'
      '401':
        description: No autorizado
        content:
          application/json:
            schema:
              $ref: '../../components/errors.yaml#/ErrorResponse'

/businesses/{id}:
  get:
    summary: Obtener un negocio por ID
    tags: [Businesses]
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    responses:
      '200':
        description: Datos del negocio
        content:
          application/json:
            schema:
              $ref: './businesses.schemas.yaml#/Business'
      '404':
        description: Negocio no encontrado
        content:
          application/json:
            schema:
              $ref: '../../components/errors.yaml#/ErrorResponse'
  put:
    summary: Actualizar negocio
    tags: [Businesses]
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './businesses.schemas.yaml#/UpdateBusinessRequest'
    responses:
      '200':
        description: Negocio actualizado exitosamente
        content:
          application/json:
            schema:
              $ref: './businesses.schemas.yaml#/Business'
      '403':
        description: Permisos insuficientes
        content:
          application/json:
            schema:
              $ref: '../../components/errors.yaml#/ErrorResponse'
      '404':
        description: Negocio no encontrado
        content:
          application/json:
            schema:
              $ref: '../../components/errors.yaml#/ErrorResponse'
  delete:
    summary: Eliminar negocio
    tags: [Businesses]
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    responses:
      '200':
        description: Negocio eliminado exitosamente
      '403':
        description: Permisos insuficientes
        content:
          application/json:
            schema:
              $ref: '../../components/errors.yaml#/ErrorResponse'
      '404':
        description: Negocio no encontrado
        content:
          application/json:
            schema:
              $ref: '../../components/errors.yaml#/ErrorResponse'
