Staff:
  type: object
  properties:
    id:
      type: integer
      readOnly: true
    businessId:
      type: integer
    userId:
      type: integer
    specialties:
      type: array
      items:
        type: string
    createdAt:
      type: string
      format: date-time
      readOnly: true

CreateStaffRequest:
  type: object
  required: [userId]
  properties:
    userId:
      type: integer
    specialties:
      type: array
      items:
        type: string
