/businesses/{id}/staff:
  get:
    summary: Listar personal de un negocio
    tags: [Staff]
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    responses:
      '200':
        description: Lista de personal
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: './staff.schemas.yaml#/Staff'
  post:
    summary: Asignar personal a un negocio
    tags: [Staff]
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './staff.schemas.yaml#/CreateStaffRequest'
    responses:
      '201':
        description: Personal asignado
        content:
          application/json:
            schema:
              $ref: './staff.schemas.yaml#/Staff'
      '403':
        description: Permisos insuficientes
        content:
          application/json:
            schema:
              $ref: '../../components/errors.yaml#/ErrorResponse'
