LoginRequest:
  type: object
  required:
    - email
    - password
  properties:
    email:
      type: string
      format: email
    password:
      type: string

RegisterRequest:
  type: object
  required:
    - name
    - email
    - password
  properties:
    name:
      type: string
    email:
      type: string
      format: email
    password:
      type: string

AuthResponse:
  type: object
  properties:
    token:
      type: string
    user:
      $ref: '../users/users.schemas.yaml#/User'
